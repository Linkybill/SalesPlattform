name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      PACKAGES_TOKEN:
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: HTTPS and lifecycle contracts
        shell: pwsh
        run: ./tests/Test-LocalHttps.ps1
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      NuGetPackageSourceCredentials_github: Username=github;Password=${{ secrets.PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@hammer2fall'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require private package access
        run: test -n "$GITHUB_PACKAGES_TOKEN"
      - run: dotnet restore backend/SalesPlattform.Backend.csproj --configfile backend/NuGet.Config
      - run: dotnet build backend/SalesPlattform.Backend.csproj -c Release --no-restore --warnaserror
      # No .NET test project exists yet. Do not report building the API as a test suite.
      - name: Frontend typecheck and production build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run lint && npm run build
      - name: Root URLs and runtime profile
        run: node --test tests/RootUrls.test.mjs
  images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: false
          tags: ci/sales-plattform-${{ matrix.component }}:${{ github.sha }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}
  required:
    if: ${{ always() }}
    needs: [contracts, build, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage
        if: ${{ needs.contracts.result != 'success' || needs.build.result != 'success' || needs.images.result != 'success' }}
        run: exit 1
