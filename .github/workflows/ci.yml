name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      PACKAGES_TOKEN:
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: HTTPS and lifecycle contracts
        shell: pwsh
        run: ./tests/Test-LocalHttps.ps1
      - name: App pipeline boundaries
        shell: pwsh
        run: ./tests/Test-AppPipeline.ps1
      - name: Zoho OAuth scope contracts
        shell: pwsh
        run: ./tests/Test-ZohoScopes.ps1
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      NuGetPackageSourceCredentials_github: Username=github;Password=${{ secrets.PACKAGES_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          registry-url: https://npm.pkg.github.com
          scope: '@hammer2fall'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require private package access
        run: |
          if [[ -z "$GITHUB_PACKAGES_TOKEN" ]]; then
            echo "::error::Repository secret PACKAGES_TOKEN fehlt. Ein Token mit read:packages und Zugriff auf die gemeinsamen Pakete wird benötigt."
            exit 1
          fi
      - run: dotnet restore backend/SalesPlattform.Backend.csproj --configfile backend/NuGet.Config
      - run: dotnet build backend/SalesPlattform.Backend.csproj -c Release --no-restore --warnaserror
      - name: Zoho task payload regression checks (no CRM writes)
        run: |
          dotnet restore tests/ZohoTaskPayload/ZohoTaskPayload.csproj --configfile backend/NuGet.Config
          dotnet build tests/ZohoTaskPayload/ZohoTaskPayload.csproj -c Release --no-restore --warnaserror
          dotnet run --project tests/ZohoTaskPayload/ZohoTaskPayload.csproj -c Release --no-build --no-restore
      # Payload checks are not live API/integration tests.
      - name: Zoho webhook security regression checks (no CRM calls)
        run: |
          dotnet restore tests/ZohoWebhook/ZohoWebhook.csproj --configfile backend/NuGet.Config
          dotnet build tests/ZohoWebhook/ZohoWebhook.csproj -c Release --no-restore --warnaserror
          dotnet run --project tests/ZohoWebhook/ZohoWebhook.csproj -c Release --no-build --no-restore
          node --test tests/WebhookDeployment.test.mjs
      - name: Report evidence regression checks (synthetic data)
        run: |
          dotnet restore tests/Reports/Reports.csproj --configfile backend/NuGet.Config
          dotnet build tests/Reports/Reports.csproj -c Release --no-restore --warnaserror
          dotnet run --project tests/Reports/Reports.csproj -c Release --no-build --no-restore
      - name: Frontend typecheck and production build
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run lint && npm run build
      - name: Daily CRM usage aggregation checks
        # Compile the real Npgsql query without live database access.
        run: |
          dotnet restore tests/Usage/Usage.csproj --configfile backend/NuGet.Config
          dotnet build tests/Usage/Usage.csproj -c Release --no-restore --warnaserror
          dotnet run --project tests/Usage/Usage.csproj -c Release --no-build --no-restore
      - name: Root URLs and runtime profile
        run: node --test tests/RootUrls.test.mjs
      - name: Sales navigation and report UI contracts
        run: node --test tests/ReportNavigation.test.mjs
      - name: Installed common theme integration
        run: node --test tests/ThemeIntegration.test.mjs
  images:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          push: false
          tags: ci/sales-plattform-${{ matrix.component }}:${{ github.sha }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}
  required:
    if: ${{ always() }}
    needs: [contracts, build, images]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage
        if: ${{ needs.contracts.result != 'success' || needs.build.result != 'success' || needs.images.result != 'success' }}
        run: exit 1
