name: Release to Hetzner
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        type: choice
        options: [hetzner-test, production]
        default: hetzner-test
        required: true
permissions:
  contents: read
  packages: read
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PUBLIC_APPLICATION_URL: ${{ vars.PUBLIC_APPLICATION_URL }}
      PUBLIC_ROUTER_URL: ${{ vars.PUBLIC_ROUTER_URL }}
      PUBLIC_PLATFORM_API_URL: ${{ vars.PUBLIC_PLATFORM_API_URL }}
      PUBLIC_TENANT_PORTAL_URL: ${{ vars.PUBLIC_TENANT_PORTAL_URL }}
      PUBLIC_KEYCLOAK_URL: ${{ vars.PUBLIC_KEYCLOAK_URL }}
      IMAGE_PULL_SECRET: ${{ vars.IMAGE_PULL_SECRET }}
      TOOLING_REF: ${{ vars.IDENTITY_PLATFORM_DEPLOY_REF }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: app
          persist-credentials: false
      - name: Require pinned platform tooling
        shell: bash
        run: |
          [[ "$TOOLING_REF" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::IDENTITY_PLATFORM_DEPLOY_REF must be a full reviewed commit SHA"; exit 1; }
      - uses: actions/checkout@v6
        with:
          repository: Hammer2Fall/IdentityPlattform
          ref: ${{ vars.IDENTITY_PLATFORM_DEPLOY_REF }}
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Prepare environment-specific manifest and release bundle
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export IMAGE_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          node platform/deploy/cicd/prepare-app-release.mjs app/backend/manifest.json platform/src/IdentityPlatform.Api/appsettings.json release
          cp -R platform/deploy/cicd/app-chart release/app-chart
          cp platform/deploy/cicd/deploy-app-remote.sh release/
          mkdir -p app/frontend/public/assets
          cp release/deployment-config.js app/frontend/public/assets/deployment-config.js
          helm template sales-plattform release/app-chart -n identity-platform -f release/values.json >/dev/null
          {
            echo "RELEASE_TAG=$RELEASE_TAG"
            echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY"
            echo "APPLICATION_URL=$(jq -r .applicationUrl release/values.json)"
            echo "PUBLIC_PLATFORM_API_URL=$(jq -r .platformApiUrl release/values.json)"
            echo "PUBLIC_TENANT_PORTAL_URL=$(jq -r .tenantPortalUrl release/values.json)"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend with matching registration manifest
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}-backend:${{ env.RELEASE_TAG }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}
          cache-from: type=gha,scope=release-backend
          cache-to: type=gha,mode=max,scope=release-backend
      - name: Publish HTTPS frontend
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}-frontend:${{ env.RELEASE_TAG }}
          build-args: |
            VITE_APPLICATION_BASE_URL=${{ env.APPLICATION_URL }}
            VITE_API_BASE_URL=${{ env.APPLICATION_URL }}
            VITE_PLATFORM_API_BASE_URL=${{ env.PUBLIC_PLATFORM_API_URL }}
            VITE_TENANT_PORTAL_URL=${{ env.PUBLIC_TENANT_PORTAL_URL }}
          secrets: |
            github_packages_token=${{ secrets.PACKAGES_TOKEN }}
          cache-from: type=gha,scope=release-frontend
          cache-to: type=gha,mode=max,scope=release-frontend
      - name: Deploy through pinned SSH host and verify HTTPS
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_CA_PEM: ${{ secrets.DEPLOY_CA_PEM }}
        run: bash platform/deploy/cicd/send-release.sh release
