name: Publish SalesPlattform

# Both local and Actions publication execute the app-owned common entry.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type publish to publish SalesPlattform and notify the platform'
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: publish-sales-plattform
  cancel-in-progress: false

env:
  IDENTITY_PLATFORM_DEPLOY_REF: ${{ vars.IDENTITY_PLATFORM_DEPLOY_REF }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tooling_ref: ${{ steps.policy.outputs.tooling_ref }}
    steps:
      - name: Require reviewed main publication and central tooling
        id: policy
        shell: pwsh
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:CONFIRMATION -cne 'publish') {
            throw 'Choose main and confirm publication with publish.'
          }
          if ($env:IDENTITY_PLATFORM_DEPLOY_REF -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Pin reviewed platform publication tooling with IDENTITY_PLATFORM_DEPLOY_REF.'
          }
          "tooling_ref=$env:IDENTITY_PLATFORM_DEPLOY_REF" >> $env:GITHUB_OUTPUT

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

  publish:
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: application-release
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: app
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Hammer2Fall/IdentityPlattform
          ref: ${{ needs.validate.outputs.tooling_ref }}
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: platform
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Bind retry to the preceding receipt artifact
        id: receipt
        shell: pwsh
        run: |
          $attempt = [int]$env:GITHUB_RUN_ATTEMPT
          if ($attempt -lt 1) { throw 'Invalid workflow attempt.' }
          "previous=application-publication-$($attempt - 1)" >> $env:GITHUB_OUTPUT
      - name: Restore the original publication on retries
        if: ${{ github.run_attempt > 1 }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.receipt.outputs.previous }}
          path: ${{ runner.temp }}/application-publication
      - name: Build and publish through the common entry
        shell: pwsh
        env:
          CENTRAL_REGISTRY_USERNAME: ${{ vars.CENTRAL_REGISTRY_USERNAME }}
          CENTRAL_REGISTRY_TOKEN: ${{ secrets.CENTRAL_REGISTRY_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/application-publication
        run: |
          ./app/publish-app.ps1 -Phase BuildPublish -PlatformRepositoryRoot ./platform -ReceiptDirectory $env:RECEIPT_DIRECTORY
      - name: Notify through the same app publisher used locally
        shell: pwsh
        env:
          APP_PUBLISHER_CLIENT_SECRET: ${{ secrets.APP_PUBLISHER_CLIENT_SECRET }}
          RECEIPT_DIRECTORY: ${{ runner.temp }}/application-publication
        run: |
          ./app/publish-app.ps1 -Phase Notify -PlatformRepositoryRoot ./platform -ReceiptDirectory $env:RECEIPT_DIRECTORY
      - name: Preserve publication ID, pinned generation and acknowledgement
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: application-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-publication/
          if-no-files-found: warn
          retention-days: 90
