apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-plattform-backend
  namespace: identity-platform
  labels: &backendLabels
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: backend
    identity-platform.io/mode: shared
spec:
  replicas: 0
  selector:
    matchLabels: *backendLabels
  template:
    metadata:
      labels: *backendLabels
    spec:
      containers:
        - name: app
          image: identity-platform/sales-plattform-backend:0.1.4
          imagePullPolicy: IfNotPresent
          # Runtime settings and central Secret references come from app-profile.
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sales-plattform-backend
  namespace: identity-platform
  labels:
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: backend
    identity-platform.io/mode: shared
spec:
  selector:
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: backend
    identity-platform.io/mode: shared
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-plattform-frontend
  namespace: identity-platform
  labels: &frontendLabels
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: frontend
    identity-platform.io/mode: shared
spec:
  replicas: 0
  selector:
    matchLabels: *frontendLabels
  template:
    metadata:
      labels: *frontendLabels
    spec:
      containers:
        - name: app
          image: identity-platform/sales-plattform-frontend:0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sales-plattform-frontend
  namespace: identity-platform
  labels:
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: frontend
    identity-platform.io/mode: shared
spec:
  selector:
    app.kubernetes.io/managed-by: identity-platform-deployment-controller
    identity-platform.io/app-key: sales-plattform
    identity-platform.io/component-key: frontend
    identity-platform.io/mode: shared
  ports:
    - name: http
      port: 80
      targetPort: http
